name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      NATIVE_MODEL_BASE_URI: ${{ vars.NATIVE_MODEL_BASE_URI }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and validate version
        id: version
        run: |
          [xml]$properties = Get-Content .\Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'Directory.Build.props contains an invalid release version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match Directory.Build.props: v$version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build pinned native dependencies and utilities
        run: .\Setup.ps1 -SkipModel

      - name: Run native engine and headless UI regressions
        run: .\tests\RunChecks.ps1

      - name: Verify locked-output publication safety
        if: matrix.runtime == 'win-x64'
        run: .\tests\PublishSafety.ps1 -RuntimeIdentifier win-x64

      - name: Check .NET build and formatting
        run: |
          dotnet build .\FuzzyFindAnything.sln -c Release -p:UseSharedCompilation=false --nologo
          if ($LASTEXITCODE -ne 0) { throw 'The solution build failed.' }
          dotnet format .\FuzzyFindAnything.sln --no-restore --verify-no-changes --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Formatting checks failed.' }

      - name: Acquire approved native model and validate parity
        if: env.NATIVE_MODEL_BASE_URI != ''
        run: |
          .\Get-Model.ps1 -BaseUri $env:NATIVE_MODEL_BASE_URI
          $runtime = '${{ matrix.runtime }}'
          $platform = if ($runtime -eq 'win-arm64') { 'ARM64' } else { 'x64' }
          dotnet run --project .\tests\FuzzyFindAnything.NativeTests\FuzzyFindAnything.NativeTests.csproj -c Release `
            -r $runtime "-p:PlatformTarget=$platform" -p:SelfContained=true -- product-parity `
            .\models\embeddinggemma-2-onnx .\tests\Fixtures ".\.test-data\parity-$runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Native model parity failed.' }

      - name: Create relocatable package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: .\Build-Release.ps1 -SkipSetup -RuntimeIdentifier $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION -ModelBaseUri $env:NATIVE_MODEL_BASE_URI

      - name: Require extracted public cold-start, recovery and reference acceptance
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          $archive = ".\artifacts\releases\FuzzyFindAnything-v$env:RELEASE_VERSION-$env:RELEASE_RUNTIME.zip"
          # Rebuild explicitly: the solution build can leave a framework-dependent runtimeconfig.
          dotnet run --project .\tests\FuzzyFindAnything.NativeTests\FuzzyFindAnything.NativeTests.csproj -c Release `
            -r win-x64 -p:PlatformTarget=x64 -p:SelfContained=true -p:UseSharedCompilation=false -- `
            first-run-acquisition $archive .\tests\Fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Public cold-start/native reference acceptance failed; package publication is blocked.' }

      - name: Verify extracted runtime
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          $archive = ".\artifacts\releases\FuzzyFindAnything-v$env:RELEASE_VERSION-$env:RELEASE_RUNTIME.zip"
          & .\artifacts\tools\FuzzyFindAnything.Tools.exe verify-release --archive $archive --runtime-id $env:RELEASE_RUNTIME --version $env:RELEASE_VERSION --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Relocated runtime verification failed.' }

      - name: Upload application ZIP
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/releases/FuzzyFindAnything-v${{ steps.version.outputs.value }}-${{ matrix.runtime }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 checksum
        id: checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/releases/FuzzyFindAnything-v${{ steps.version.outputs.value }}-${{ matrix.runtime }}.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Download published files for verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.package.outputs.artifact-id }},${{ steps.checksum.outputs.artifact-id }}
          path: artifacts/download-check
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error

      - name: Verify single-ZIP downloads
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.artifact-digest }}
          PACKAGE_URL: ${{ steps.package.outputs.artifact-url }}
          CHECKSUM_URL: ${{ steps.checksum.outputs.artifact-url }}
        run: |
          $name = "FuzzyFindAnything-v$env:RELEASE_VERSION-$env:RELEASE_RUNTIME.zip"
          $archive = Join-Path .\artifacts\download-check $name
          $checksum = $archive + '.sha256'
          $files = @(Get-ChildItem -LiteralPath .\artifacts\download-check -File -Recurse)
          if ($files.Count -ne 2 -or -not (Test-Path -LiteralPath $archive) -or -not (Test-Path -LiteralPath $checksum)) {
            throw 'Downloads must retain the exact versioned ZIP and checksum filenames without an outer archive.'
          }
          $expected = (Get-FileHash -LiteralPath (Join-Path .\artifacts\releases $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = (Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+'
          if ($actual -ne $expected -or $actual -ne $env:PACKAGE_DIGEST -or
              $sidecar.Count -ne 2 -or $sidecar[0] -ne $actual -or $sidecar[1] -cne $name) {
            throw 'The downloaded ZIP or checksum differs from the verified release package.'
          }
          & .\artifacts\tools\FuzzyFindAnything.Tools.exe verify-release --archive $archive --runtime-id $env:RELEASE_RUNTIME --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded release inventory verification failed.' }
          "## $env:RELEASE_RUNTIME download" >> $env:GITHUB_STEP_SUMMARY
          "[$name]($env:PACKAGE_URL) | [SHA-256 checksum]($env:CHECKSUM_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP once, then open FuzzyFindAnything.exe." >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish release downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: FuzzyFindAnything-v*-win-*
          path: release
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error

      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check --strict *.sha256
          cat > release-notes.md <<'NOTES'
          ## Download and run

          Choose **win-x64** for Intel/AMD or **win-arm64** for Windows on ARM.
          Extract the complete ZIP and open **FuzzyFindAnything.exe**.
          First launch automatically downloads and verifies the pinned public
          **onnx-community/embeddinggemma-2-ONNX** FP32 model into your application-data
          cache. No Python, Node.js, SDK, model conversion or manual Apply is required.
          .NET and native runtimes are included.

          Native ONNX model assets are approximately 1.8 GB uncompressed.
          An internet connection is needed for first-time acquisition; completed caches work offline.
          Packages are unsigned. Check the matching SHA-256 file and follow your
          organization's application policy.

          See the included QUICKSTART.md and docs/MIGRATION.md before upgrading.
          ARM64 UI and inference are native; the DiskANN coordinator and IFilter
          helper deliberately use x64 compatibility.

          This release contains the application/runtime only, not personal indexes,
          folder configuration, or model weights. FuzzyFindAnything 2.0 is authored
          by Suman Ghosh. Application code is MIT-licensed; dependencies and models
          retain their upstream licenses and terms. See APPLICATION-LICENSE and
          the bundled third-party notices.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "FuzzyFindAnything 2.0 ($RELEASE_TAG)" --notes-file release-notes.md \
            "${prerelease[@]}" *.zip *.sha256
          gh release edit "$RELEASE_TAG" --draft=false
