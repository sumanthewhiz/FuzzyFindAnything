name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NATIVE_MODEL_BASE_URI: ${{ vars.NATIVE_MODEL_BASE_URI }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and validate version
        id: version
        run: |
          [xml]$properties = Get-Content .\Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'Directory.Build.props contains an invalid release version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match Directory.Build.props: v$version."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not $env:NATIVE_MODEL_BASE_URI) {
            throw 'Tagged native releases require an approved NATIVE_MODEL_BASE_URI for model parity validation.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build pinned native dependencies and utilities
        run: .\Setup.ps1 -SkipModel

      - name: Run native engine and headless UI regressions
        run: .\tests\RunChecks.ps1

      - name: Verify locked-output publication safety
        if: matrix.runtime == 'win-x64'
        run: .\tests\PublishSafety.ps1 -RuntimeIdentifier win-x64

      - name: Check .NET build and formatting
        run: |
          dotnet build .\FuzzyFindAnything.sln -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'The solution build failed.' }
          dotnet format .\FuzzyFindAnything.sln --no-restore --verify-no-changes --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Formatting checks failed.' }

      - name: Acquire approved native model and validate parity
        if: env.NATIVE_MODEL_BASE_URI != ''
        run: |
          .\Get-Model.ps1 -BaseUri $env:NATIVE_MODEL_BASE_URI
          $runtime = '${{ matrix.runtime }}'
          $platform = if ($runtime -eq 'win-arm64') { 'ARM64' } else { 'x64' }
          dotnet run --project .\tests\FuzzyFindAnything.NativeTests\FuzzyFindAnything.NativeTests.csproj -c Release `
            -r $runtime "-p:PlatformTarget=$platform" -p:SelfContained=true -- product-parity `
            .\models\embeddinggemma-2-onnx .\tests\Fixtures ".\.test-data\parity-$runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Native model parity failed.' }

      - name: Create relocatable package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: .\Build-Release.ps1 -SkipSetup -RuntimeIdentifier $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION

      - name: Verify extracted runtime
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          $archive = ".\artifacts\releases\FuzzyFindAnything-v$env:RELEASE_VERSION-$env:RELEASE_RUNTIME.zip"
          & .\artifacts\tools\FuzzyFindAnything.Tools.exe verify-release --archive $archive --runtime-id $env:RELEASE_RUNTIME --version $env:RELEASE_VERSION --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Relocated runtime verification failed.' }

      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FuzzyFindAnything-${{ matrix.runtime }}
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: FuzzyFindAnything-win-*
          path: release
          merge-multiple: true

      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check --strict *.sha256
          cat > release-notes.md <<'NOTES'
          ## Download and run

          Choose **win-x64** for Intel/AMD or **win-arm64** for Windows on ARM.
          Extract the complete ZIP and provision the separately approved
          **embeddinggemma-2-onnx-v1** model bundle using **Get-Model.ps1**.
          Then open **FuzzyFindAnything.exe**. This application is Python-free;
          .NET and native runtimes are included.

          Native ONNX model assets are approximately 1.8 GB uncompressed.
          Use the approved bundle/base URI, not the earlier safetensors layout.
          Packages are unsigned. Check the matching SHA-256 file and follow your
          organization's application policy.

          See the included QUICKSTART.md and docs/MIGRATION.md before upgrading.
          ARM64 UI and inference are native; the DiskANN coordinator and IFilter
          helper deliberately use x64 compatibility.

          This release contains the application/runtime only, not personal indexes,
          folder configuration, or model weights. FuzzyFindAnything 2.0 is authored
          by Suman Ghosh. Application code is MIT-licensed; dependencies and models
          retain their upstream licenses and terms. See APPLICATION-LICENSE and
          the bundled third-party notices.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "FuzzyFindAnything 2.0 ($RELEASE_TAG)" --notes-file release-notes.md \
            "${prerelease[@]}" *.zip *.sha256
          gh release edit "$RELEASE_TAG" --draft=false
